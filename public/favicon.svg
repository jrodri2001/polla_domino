<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0f1b2d"/>
  <!-- Left tile (6|5) rotated -12deg -->
  <g transform="translate(18,33) rotate(-12)">
    <rect x="-10" y="-18" width="20" height="36" rx="2.5" fill="#fff"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#0f1b2d" stroke-width="0.8"/>
    <!-- top: 6 pips (3 rows of 2) -->
    <circle cx="-4" cy="-13" r="1.8" fill="#0f1b2d"/>
    <circle cx="4" cy="-13" r="1.8" fill="#0f1b2d"/>
    <circle cx="-4" cy="-7.5" r="1.8" fill="#0f1b2d"/>
    <circle cx="4" cy="-7.5" r="1.8" fill="#0f1b2d"/>
    <circle cx="-4" cy="-2.5" r="1.8" fill="#0f1b2d"/>
    <circle cx="4" cy="-2.5" r="1.8" fill="#0f1b2d"/>
    <!-- bottom: 5 pips -->
    <circle cx="-4" cy="4" r="1.8" fill="#0f1b2d"/>
    <circle cx="4" cy="4" r="1.8" fill="#0f1b2d"/>
    <circle cx="0" cy="9" r="1.8" fill="#0f1b2d"/>
    <circle cx="-4" cy="14" r="1.8" fill="#0f1b2d"/>
    <circle cx="4" cy="14" r="1.8" fill="#0f1b2d"/>
  </g>
  <!-- Right tile (4|3) rotated 12deg -->
  <g transform="translate(46,33) rotate(12)">
    <rect x="-10" y="-18" width="20" height="36" rx="2.5" fill="#fff"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#0f1b2d" stroke-width="0.8"/>
    <!-- top: 4 pips -->
    <circle cx="-4" cy="-12" r="1.8" fill="#0f1b2d"/>
    <circle cx="4" cy="-12" r="1.8" fill="#0f1b2d"/>
    <circle cx="-4" cy="-4" r="1.8" fill="#0f1b2d"/>
    <circle cx="4" cy="-4" r="1.8" fill="#0f1b2d"/>
    <!-- bottom: 3 pips (diagonal) -->
    <circle cx="-4" cy="4" r="1.8" fill="#0f1b2d"/>
    <circle cx="0" cy="9" r="1.8" fill="#0f1b2d"/>
    <circle cx="4" cy="14" r="1.8" fill="#0f1b2d"/>
  </g>
</svg>